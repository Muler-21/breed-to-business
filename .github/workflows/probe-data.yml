# Checks which public genotype repositories GitHub's runners can reach and lists their files.
name: Probe public genotype data
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download Da Silva et al. 2024 African sheep PLINK set
        run: |
          mkdir -p d && cd d
          for a in 26731378 26731360 26731114; do curl -sSL --max-time 300 -o $a.zip https://figshare.com/ndownloader/articles/$a/versions/2 || curl -sSL --max-time 300 -o $a.zip https://figshare.com/ndownloader/articles/$a; file $a.zip; unzip -o -q $a.zip || true; done
          ls -la
          f=$(ls *.fam | head -1); echo "== $f"; awk '{print $1}' "$f" | sort | uniq -c | sort -k2 | awk '{printf "%s:%s  ", $2, $1} END {print ""}'
          head -3 *.fam; head -3 *.bim; cut -f1 *.bim | sort | uniq -c | head -40
