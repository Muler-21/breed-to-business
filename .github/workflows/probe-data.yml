# Checks which public genotype repositories GitHub's runners can reach and lists their files.
name: Probe public genotype data
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Figshare search
        run: |
          for v in 1 2; do echo "== version $v"; curl -sSL --max-time 60 https://api.figshare.com/v2/articles/26731378/versions/$v | python3 -c "
          import json,sys; d=json.load(sys.stdin); print(d.get('title')); [print('FILE',f['name'], f['size'], f['download_url']) for f in d.get('files',[])]; print(d.get('description','')[:2000])" || true; done
          curl -sSL --max-time 60 -X POST -H 'Content-Type: application/json' -d '{"search_for":"OaSNP2818x28210","page_size":50}' https://api.figshare.com/v2/articles/search | python3 -c "
          import json,sys; [print(a['id'], a['title'], a.get('url_public_html')) for a in json.load(sys.stdin)]"
          curl -sSL --max-time 60 -X POST -H 'Content-Type: application/json' -d '{"search_for":"African sheep Plink genotypes 2818","page_size":50}' https://api.figshare.com/v2/articles/search | python3 -c "
          import json,sys; [print(a['id'], a['title'], a.get('url_public_html')) for a in json.load(sys.stdin)]"
